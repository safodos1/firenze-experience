<style>

:root[data-theme="dark"]{--bg:#0A1130;--card:#141F4A;--ink:#F3EAD3;--muted:#B9B09B;--gold:#D9B15B;--gold-ink:#E8C57A;--gold-hi:#F2D894;--gold-lo:#B8893A;--wine:#B8384C;--line:rgba(227,193,116,.28);color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:400 16px/1.6 var(--f-sans);margin:0}
.wrap{max-width:1040px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:56px}
.brand{font:700 1rem/1 var(--f-display);color:#F3EAD3;text-decoration:none;letter-spacing:.06em;white-space:nowrap}.brand i{color:var(--gold-hi);font-style:normal}

.aria": "Jeu de course sans fin : un personnage de dessin animé court dans les rues de Florence et saute par-dessus les obstacles.", "game.hero": "Votre héros", "game.back": "Retour au site", "game.zone1": "Piazza del Duomo", "game.zone2": "Piazza della Signoria", "game.zone3": "Ponte Vecchio", "game.zone4": "Lungarno", "game.dist": "Mètres", "gp.eyebrow": "Jeu secret débloqué", "gp.t1": "Faites sauter les obstacles à", "gp.t2": "!", "gp.sub": "Aidez-le à courir dans les rues de Florence : sautez par-dessus vases, scooters et touristes à perche à selfie, baissez-vous sous les pigeons et battez votre record.", "gp.plate": "Héros de Florence", "gp.c1": "ESPACE ou ↑ pour sauter", "gp.c2": "↓ pour se baisser", "gp.c3": "Sur téléphone : touchez l’écran", "gp.back": "Retour à Florence Experience", "gp.foot": "Jeu secret de Florence Experience · votre record reste dans votre navigateur", "gp.lang": "Changer de langue", "gp.theme": "Basculer entre thème clair et sombre", "gp.title": "La course de Catalano Lorenzo"}};

/* ============================ IL RUNNER ============================ */
const RUN = (() => {

  let state = 'ready'; // ready | run | over | pause
  let hi = 0;

  const hero = { x: 70, y: GY, vy: 0, jump: false, duck: false, frame: 0, holdJump: false, fast: false };
  const rnd = (a, b) => a + Math.random() * (b - a);
  const layers = {};

  /* ---- sfondo: skyline di Firenze pre-disegnata (giorno e notte) ---- */
  function buildSky(night) {
    const c = document.createElement('canvas'); c.width = 1800; c.height = 260; const x = c.getContext('2d');
    const col = night ? { far: '#2A2350', mid: '#3A2A55', wall: '#4A3158', roof: '#6A2E3E', dome: '#7A3347', win: '#F3D58B' } : { far: '#C9B3A0', mid: '#B08A78', wall: '#D9B98E', roof: '#B5502F', dome: '#C25A38', win: '#8A6A4A' };
    // colline lontane
    x.fillStyle = col.far; x.beginPath(); x.moveTo(0, 260); for (let i = 0; i <= 1800; i += 60) x.lineTo(i, 170 + Math.sin(i / 170) * 26 + Math.sin(i / 61) * 8); x.lineTo(1800, 260); x.fill();

    // case basse con tetti
    const house = (hx, w, h) => { x.fillStyle = col.wall; x.fillRect(hx, base - h, w, h); x.fillStyle = col.roof; x.beginPath(); x.moveTo(hx - 4, base - h); x.lineTo(hx + w / 2, base - h - 14); x.lineTo(hx + w + 4, base - h); x.fill(); x.fillStyle = col.win; for (let k = 8; k < w - 8; k += 16) x.fillRect(hx + k, base - h + 10, 6, 10); };
    for (let hx = 0; hx < 1800; hx += 58 + (hx % 3) * 6) house(hx, 48 + (hx % 5) * 3, 40 + (hx * 7 % 5) * 6);
    // Duomo: cupola (x=300)
    const dome = (dx) => { x.fillStyle = col.wall; x.fillRect(dx - 80, base - 70, 160, 70); x.fillStyle = col.dome; x.beginPath(); x.ellipse(dx, base - 70, 58, 74, 0, Math.PI, 0); x.fill(); x.strokeStyle = col.roof; x.lineWidth = 2; for (let k = -40; k <= 40; k += 20) { x.beginPath(); x.moveTo(dx + k, base - 72); x.quadraticCurveTo(dx + k * .6, base - 120, dx, base - 142); x.stroke(); } x.fillStyle = col.wall; x.fillRect(dx - 7, base - 168, 14, 28); x.fillStyle = col.dome; x.beginPath(); x.moveTo(dx - 8, base - 168); x.lineTo(dx, base - 190); x.lineTo(dx + 8, base - 168); x.fill(); x.fillStyle = col.win; for (let k = -60; k <= 50; k += 22) { x.beginPath(); x.arc(dx + k + 6, base - 40, 6, Math.PI, 0); x.fillRect(dx + k, base - 40, 12, 16); x.fill(); } };

    return c;
  }
  function buildStars() { const c = document.createElement('canvas'); c.width = 900; c.height = 190; const x = c.getContext('2d'); x.fillStyle = '#FFF4E0'; for (let i = 0; i < 70; i++) { x.globalAlpha = .4 + Math.random() * .6; x.fillRect(Math.random() * 900, Math.random() * 190, 1.5 + Math.random(), 1.5 + Math.random()); } return c; }

  /* ---- il personaggio cartoon ---- */
  function drawHero(c, x, y, st, fr, pose) {
    const P = pose || hero;
    // (x,y) = angolo in basso a sinistra del riquadro 48×66
    const ink = '#2B1A22', run = st === 'run' && !P.jump;

  $('#btnTheme').onclick = () => { const dark = S.theme ? S.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches; S.theme = dark ? 'light' : 'dark'; applyTheme(); savePref(); };
  const back = (e) => { e.preventDefault(); if (history.length > 1 && document.referrer) history.back(); else location.href = 'index.html'; };
  $('#rnBack').onclick = back; $('#brandLink').onclick = back;
  RUN.init(); RUN.start();
  /* ritratto che corre sul posto */
  const pc = $('#ptCv'), px = pc.getContext('2d'); let fr = 0, lastT = 0;
  (function loop(now) { requestAnimationFrame(loop); if (now - lastT < 33) return; lastT = now; fr++; px.clearRect(0, 0, 330, 390); px.save(); px.translate(0, 0); px.scale(4, 4); RUN.drawHero(px, 17, 95, 'run', fr, { jump: false, duck: false }); px.restore(); })(0);
});
